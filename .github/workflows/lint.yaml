name: Flutter Lint

on:
  pull_request:
    branches: [ "main",]

  push:
    branches: [ "main" ]
jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Melos scripts call `melos exec`, so the CLI must be on PATH.
      # Keep this version in sync with the root pubspec.lock.
      - name: Install Melos
        run: |
          dart pub global activate melos 7.8.2
          echo "$PUB_CACHE/bin" >> "$GITHUB_PATH"

      - name: Run Build Runner
        run: melos run gen

      - name: Run tests
        run: melos run test

      - name: Run Analyze
        run: melos run analyze
