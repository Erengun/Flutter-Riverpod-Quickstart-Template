name: app_lints
description: Empty analyzer plugin where an app built from the template adds its own rules.
publish_to: none
version: 0.1.0

# Not a workspace member: analyzer plugins resolve their own dependencies.
# The root analysis_options.yaml references this package by path.

environment:
  sdk: ^3.13.0

dependencies:
  # analysis_server_plugin is still 0.x and can break on SDK bumps, so it is
  # pinned. Keep it on the same version as packages/konteyner_lints.
  analysis_server_plugin: 0.3.24
  analyzer: 14.5.0
