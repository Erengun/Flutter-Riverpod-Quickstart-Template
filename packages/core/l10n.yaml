# gen-l10n settings for Core. `flutter pub get` regenerates the classes in
# lib/l10n/; the generated files are committed.
arb-dir: lib/l10n
template-arb-file: core_en.arb
output-localization-file: core_localizations.dart
output-class: CoreLocalizations
nullable-getter: false
preferred-supported-locales: [en]
untranslated-messages-file: build/untranslated_messages.json
