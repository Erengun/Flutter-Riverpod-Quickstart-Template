name: core
description: Infrastructure every app built from the template gets.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; the generated localizations import it.
  intl: any
  hive_ce: ^2.11.1
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  logging: ^1.3.0
  stack_trace: ^1.11.0
  material_ui: ^1.6.0
  dio: ^5.9.0
  dio_smart_retry: ^7.0.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  upgrader: ^13.7.0
  in_app_update: ^5.0.0
  version: ^3.0.2
  flutter_secure_storage: ^10.3.4

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.2
  json_serializable: ^6.14.0

flutter:
  # gen-l10n: `flutter pub get` regenerates lib/l10n/ from l10n.yaml.
  generate: true
