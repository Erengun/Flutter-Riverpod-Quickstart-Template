name: core
description: Infrastructure every app built from the template gets.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Pinned by flutter_localizations; the generated localizations import it.
  intl: any
  hive_ce: ^2.11.1
  go_router: ^18.0.2
  flutter_riverpod: ^3.4.3
  logging: ^1.3.0
  stack_trace: ^1.11.0
  material_ui: ^1.6.0
  upgrader: ^13.7.0
  in_app_update: ^5.0.0
  version: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # gen-l10n: `flutter pub get` regenerates lib/l10n/ from l10n.yaml.
  generate: true
