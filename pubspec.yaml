name: flutter_riverpod_template_workspace
description: Workspace root. The app lives in app/ and shared packages in packages/.
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.4"

workspace:
  - app
  - packages/core
  - packages/firebase_module
  - packages/sentry_module
  - widgetbook

dev_dependencies:
  melos: ^7.8.1

# widgetbook_generator 3.24 (widgetbook/) allows analyzer below 14, but
# build_runner 2.16 needs analyzer 14. The generator runs fine on 14, so this
# lifts its cap. Remove it once a widgetbook_generator release allows
# analyzer 14, or when Widgetbook is removed.
dependency_overrides:
  analyzer: ^14.3.0

melos:
  scripts:
    gen:
      description: Run build_runner in every package that depends on it.
      run: melos exec --concurrency=1 --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs

    test:
      description: Run flutter test in every package that has a test folder.
      run: melos exec --concurrency=1 --dir-exists=test -- flutter test --coverage && melos run test:lints

    analyze:
      description: Run flutter analyze and dart analyze in every package.
      run: melos exec --concurrency=1 -- "flutter analyze --no-pub --fatal-infos --fatal-warnings && dart analyze --fatal-infos --fatal-warnings" && melos run analyze:lints

    widgetbook:
      description: Run the Widgetbook catalog in Chrome.
      run: cd widgetbook && flutter run -d chrome

    # The analyzer plugins in packages/konteyner_lints and packages/app_lints
    # are not workspace members, so melos exec skips them. These scripts cover them.
    test:lints:
      description: Run the analyzer rule tests in packages/konteyner_lints.
      run: cd packages/konteyner_lints && dart pub get && dart test

    analyze:lints:
      description: Run dart analyze in the analyzer plugin packages.
      run: (cd packages/konteyner_lints && dart pub get && dart analyze --fatal-infos --fatal-warnings) && (cd packages/app_lints && dart pub get && dart analyze --fatal-infos --fatal-warnings)

    # Firebase (packages/firebase_module): one script per flavor, run in app/.
    # Each runs `flutterfire configure` once per iOS build configuration
    # (Debug, Profile, Release); every run also writes the Dart options file,
    # google-services.json and the web app. Edit --project and the ids to
    # match your app. Needs the Firebase CLI and flutterfire_cli. Delete these
    # scripts when you remove the Module.
    firebase:configure:dev:
      description: Configure Firebase for the dev flavor (Android, iOS, web).
      run: >-
        cd app &&
        flutterfire configure --yes --project=my-app-dev --platforms=android,ios,web --android-package-name=com.example.temp.dev --ios-bundle-id=com.example.temp.dev --out=../packages/firebase_module/lib/src/options/firebase_options_dev.dart --android-out=android/app/src/dev/google-services.json --ios-out=ios/flavors/dev/GoogleService-Info.plist --ios-build-config=Debug-dev &&
        flutterfire configure --yes --project=my-app-dev --platforms=android,ios,web --android-package-name=com.example.temp.dev --ios-bundle-id=com.example.temp.dev --out=../packages/firebase_module/lib/src/options/firebase_options_dev.dart --android-out=android/app/src/dev/google-services.json --ios-out=ios/flavors/dev/GoogleService-Info.plist --ios-build-config=Profile-dev &&
        flutterfire configure --yes --project=my-app-dev --platforms=android,ios,web --android-package-name=com.example.temp.dev --ios-bundle-id=com.example.temp.dev --out=../packages/firebase_module/lib/src/options/firebase_options_dev.dart --android-out=android/app/src/dev/google-services.json --ios-out=ios/flavors/dev/GoogleService-Info.plist --ios-build-config=Release-dev

    firebase:configure:staging:
      description: Configure Firebase for the staging flavor (Android, iOS, web).
      run: >-
        cd app &&
        flutterfire configure --yes --project=my-app-staging --platforms=android,ios,web --android-package-name=com.example.temp.staging --ios-bundle-id=com.example.temp.staging --out=../packages/firebase_module/lib/src/options/firebase_options_staging.dart --android-out=android/app/src/staging/google-services.json --ios-out=ios/flavors/staging/GoogleService-Info.plist --ios-build-config=Debug-staging &&
        flutterfire configure --yes --project=my-app-staging --platforms=android,ios,web --android-package-name=com.example.temp.staging --ios-bundle-id=com.example.temp.staging --out=../packages/firebase_module/lib/src/options/firebase_options_staging.dart --android-out=android/app/src/staging/google-services.json --ios-out=ios/flavors/staging/GoogleService-Info.plist --ios-build-config=Profile-staging &&
        flutterfire configure --yes --project=my-app-staging --platforms=android,ios,web --android-package-name=com.example.temp.staging --ios-bundle-id=com.example.temp.staging --out=../packages/firebase_module/lib/src/options/firebase_options_staging.dart --android-out=android/app/src/staging/google-services.json --ios-out=ios/flavors/staging/GoogleService-Info.plist --ios-build-config=Release-staging

    firebase:configure:prod:
      description: Configure Firebase for the prod flavor (Android, iOS, web).
      run: >-
        cd app &&
        flutterfire configure --yes --project=my-app-prod --platforms=android,ios,web --android-package-name=com.example.temp --ios-bundle-id=com.example.temp --out=../packages/firebase_module/lib/src/options/firebase_options_prod.dart --android-out=android/app/src/prod/google-services.json --ios-out=ios/flavors/prod/GoogleService-Info.plist --ios-build-config=Debug-prod &&
        flutterfire configure --yes --project=my-app-prod --platforms=android,ios,web --android-package-name=com.example.temp --ios-bundle-id=com.example.temp --out=../packages/firebase_module/lib/src/options/firebase_options_prod.dart --android-out=android/app/src/prod/google-services.json --ios-out=ios/flavors/prod/GoogleService-Info.plist --ios-build-config=Profile-prod &&
        flutterfire configure --yes --project=my-app-prod --platforms=android,ios,web --android-package-name=com.example.temp --ios-bundle-id=com.example.temp --out=../packages/firebase_module/lib/src/options/firebase_options_prod.dart --android-out=android/app/src/prod/google-services.json --ios-out=ios/flavors/prod/GoogleService-Info.plist --ios-build-config=Release-prod
