name: flutter_riverpod_template_workspace
description: Workspace root. The app lives in app/ and shared packages in packages/.
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - app
  - packages/core

dev_dependencies:
  melos: ^7.8.1

melos:
  scripts:
    gen:
      description: Run build_runner in every package that depends on it.
      run: melos exec --concurrency=1 --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs

    test:
      description: Run flutter test in every package that has a test folder.
      run: melos exec --concurrency=1 --dir-exists=test -- flutter test && melos run test:lints

    analyze:
      description: Run flutter analyze and dart analyze in every package.
      run: melos exec --concurrency=1 -- "flutter analyze --no-pub --fatal-infos --fatal-warnings && dart analyze --fatal-infos --fatal-warnings" && melos run analyze:lints

    # The analyzer plugins in packages/konteyner_lints and packages/app_lints
    # are not workspace members, so melos exec skips them. These scripts cover them.
    test:lints:
      description: Run the analyzer rule tests in packages/konteyner_lints.
      run: cd packages/konteyner_lints && dart pub get && dart test

    analyze:lints:
      description: Run dart analyze in the analyzer plugin packages.
      run: (cd packages/konteyner_lints && dart pub get && dart analyze --fatal-infos --fatal-warnings) && (cd packages/app_lints && dart pub get && dart analyze --fatal-infos --fatal-warnings)
