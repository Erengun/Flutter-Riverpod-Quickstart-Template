org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# App identity. A new app edits only these keys. The Kotlin namespace and
# package path stay com.example.temp; Android allows them to differ from the
# application id.
app.applicationId=com.example.temp
app.dev.applicationIdSuffix=.dev
app.dev.versionNameSuffix=-dev
app.dev.name=Temp Dev
app.staging.applicationIdSuffix=.staging
app.staging.versionNameSuffix=-staging
app.staging.name=Temp Staging
app.prod.applicationIdSuffix=
app.prod.versionNameSuffix=
app.prod.name=Temp
