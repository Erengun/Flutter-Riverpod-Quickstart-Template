name: widgetbook_catalog
description: Widgetbook catalog of Core's screens and the app's demo screens (web only).
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0

# The app never depends on this package. Removing a Module also removes its
# line here and its use cases.
dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod_template:
    path: ../app
  core:
    path: ../packages/core
  firebase_module:
    path: ../packages/firebase_module
  sentry_module:
    path: ../packages/sentry_module

  widgetbook: ^3.25.0
  widgetbook_annotation: ^3.11.0
  # The accessibility addon: widgetbook's own AccessibilityAddon is
  # deprecated in favor of this package in a BuilderAddon. Kept on the major
  # widgetbook depends on.
  accessibility_tools: ^2.6.0

  flutter_riverpod: ^3.4.3
  hive_ce: ^2.11.1
  material_ui: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.16.2
  widgetbook_generator: ^3.24.0

flutter:
  uses-material-design: true
